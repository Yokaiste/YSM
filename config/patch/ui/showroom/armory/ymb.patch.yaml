version: 1
id: 'ysm.ui.showroom.armory'
name: 'YSM Armory'
description: 'Raises the armory per-category cap to the YSM deck slot count.'
enabled: true
scope: 'prod'
optional: true
dependsOn: []
targets:
  - file: 'GameData/UserInterface/Use/ShowRoom/Views/UISpecificShowRoomArmoryComponent.ndf'
    operations:
      - op: 'remove'
        selector:
          kind: 'object'
          by: 'name'
          value: 'MaxUnitsInDeckPerCategory'
      - op: 'add'
        position: { mode: 'after', anchor: 'ArmoryUnitButtonRadioManager' }
        value:
          $raw: |-
            MaxUnitsInDeckPerCategory is ${deckSlotCount}
