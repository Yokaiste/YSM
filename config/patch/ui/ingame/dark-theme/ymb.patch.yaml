version: 1
id: 'ysm.ui.ingame.dark-theme'
name: 'YSM Dark HUD'
description: 'Charcoal match panels with soft white text, subtle borders and clear light accents.'
enabled: true
scope: 'prod'
dependsOn: []

# RGBA channels: 0..255. Local overrides belong in YMB/ymb.config.yaml.
# References follow overrides, so changing a shared color also updates its consumers.
variables:
  hudPalette:
    panel: [22, 23, 25, 232]
    panelTranslucent: [22, 23, 25, 210]
    raised: [36, 37, 40, 242]
    border: [106, 108, 113, 170]
    text: [230, 230, 228, 255]
    textMuted: [230, 230, 228, 180]
    textFaint: [230, 230, 228, 120]
    accent: [250, 250, 247, 255]
    weaponInset: [137, 140, 145, 250]
    transparent: [0, 0, 0, 0]
    tooltip: '${hudPalette.panel}'
    alertFade: '${hudPalette.transparent}'
    alertBackground: '${hudPalette.panel}'
    button:
      Normal: '${hudPalette.raised}'
      Highlighted: [64, 66, 70, 250]
      Clicked: [86, 88, 93, 255]
      Toggled: [83, 86, 92, 255]
      ToggleHighlighted: [104, 107, 113, 255]
      ToggleClicked: [68, 70, 75, 255]
      Grayed: [25, 26, 28, 200]
    buttonLine:
      Normal: '${hudPalette.border}'
      Highlighted: [217, 218, 219, 240]
      Clicked: '${hudPalette.accent}'
      Toggled: [235, 235, 232, 255]
      ToggleHighlighted: '${hudPalette.accent}'
      ToggleClicked: [209, 211, 214, 255]
      Grayed: [73, 75, 79, 140]
    buttonText:
      Normal: '${hudPalette.text}'
      Highlighted: '${hudPalette.accent}'
      Clicked: '${hudPalette.accent}'
      Toggled: '${hudPalette.accent}'
      ToggleHighlighted: '${hudPalette.accent}'
      ToggleClicked: '${hudPalette.accent}'
      Grayed: [137, 139, 144, 200]
    medium:
      Normal: [90, 93, 98, 255]
      Highlighted: [125, 128, 132, 255]
    weaponOverlay:
      Normal: [255, 255, 255, 12]
      Highlighted: [255, 255, 255, 35]
      Toggled: [0, 0, 0, 120]
      ToggleHighlighted: [0, 0, 0, 90]
      Grayed: [0, 0, 0, 100]

scripts:
  - path: 'build.ts'
    tests:
      - 'build.test.ts'

targets:
  - file: 'GameData/UserInterface/Use/InGame/UIInGameResources.ndf'
    operations:
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'UIInGameResource.MainStyleGuide'
        value: '~/YSMInGameStyleGuide'

  # The speed icons contain baked cyan. Use WARNO's grayscale drawer on just these textures.
  - file: 'GameData/UserInterface/Use/InGame/UISpecificInGameHUDTimePanelView.ndf'
    operations:
      - forEach: [Pause, Slow, Play, Fast, VeryFast]
        as: speed
        do:
          - op: 'modify'
            selector:
              kind: 'field'
              by: 'path'
              value: 'TimePanelSpeedButtons.Elements.[ComponentDescriptor.ElementName="Speed${speed}Button"].ComponentDescriptor.BackgroundTexture'
            value: { $string: '' }
          - op: 'add'
            selector:
              kind: 'field'
              by: 'path'
              value: 'TimePanelSpeedButtons.Elements.[ComponentDescriptor.ElementName="Speed${speed}Button"].ComponentDescriptor.ForegroundTexture'
            value: { $string: '' }
          - op: 'add'
            selector:
              kind: 'field'
              by: 'path'
              value: 'TimePanelSpeedButtons.Elements.[ComponentDescriptor.ElementName="Speed${speed}Button"].ComponentDescriptor.Components'
            value:
              $raw: |-
                [
                    BUCKTextureDescriptor
                    (
                        ComponentFrame = TUIFramePropertyRTTI(RelativeWidthHeight = [1.0, 1.0])
                        TextureFrame = TUIFramePropertyRTTI(RelativeWidthHeight = [1.0, 1.0])
                        TextureToken = "vitesse0${speedIndex + 1}"
                        TextureDrawer = "ColorMultiply_Grayscale"
                        TextureColorToken = "BoutonTemps_Text"
                    ),
                ]

  # A small light inset keeps the game's dark weapon silhouettes legible on charcoal.
  - file: 'GameData/UserInterface/Use/InGame/UISpecificUnitSelectionWeaponPanelView.ndf'
    operations:
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'PanelInfoArmeHaut.Components'
        value:
          $raw: |-
            (<IsSelection> ?
                [
                    PanelRoundedCorner
                    (
                        ComponentFrame = TUIFramePropertyRTTI
                        (
                            MagnifiableWidthHeight = [122.0, 30.0]
                            MagnifiableOffset = [0.0, -8.0]
                            AlignementToFather = [0.5, 0.5]
                            AlignementToAnchor = [0.5, 0.5]
                        )
                        BackgroundBlockColorToken = 'TypeD'
                        HasBorder = false
                        Radius = 3
                    ),
                ]
                : []) +
            [
                ~/WeaponPanelWeaponIcon,
                WeaponPanelWeaponName(IsSelection = <IsSelection>),
            ] + (<IsSelection> ?
            [
                ~/WeaponRadarIcon,
            ] : [])
