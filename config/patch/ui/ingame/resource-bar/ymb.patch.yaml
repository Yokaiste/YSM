version: 1
id: 'ysm.ui.ingame.resource-bar'
name: 'YSM Resource Bar'
description: 'Show resources directly over the battlefield without a background bar.'
enabled: true
scope: 'prod'
optional: true
dependsOn: []
targets:
  - file: 'GameData/UserInterface/Use/InGame/UIInGameResources.ndf'
    operations:
      - op: 'remove'
        selector:
          kind: 'field'
          by: 'path'
          value: 'InGameMainContainerResource.ForegroundComponents.Components.[UniqueName="barre_du_haut"].HasBackground'
      - op: 'remove'
        selector:
          kind: 'field'
          by: 'path'
          value: 'InGameMainContainerResource.ForegroundComponents.Components.[UniqueName="barre_du_haut"].BackgroundBlockColorToken'
