            minChanges: 7
          - field: ResistanceRear
            set: { $raw: 'TResistanceTypeRTTI(Family=ResistanceFamily_infanterie Index=2)' }
            minChanges: 7
          - field: ResistanceTop
            set: { $raw: 'TResistanceTypeRTTI(Family=ResistanceFamily_infanterie Index=2)' }
            minChanges: 7
          - field: MaxSuppressionDamages
            set: { $raw: '${immortalDamageRaw}' }
            minChanges: 7
          - field: DistanceToFleeGRU
            set: { $raw: '0' }
            minChanges: 7
          - field: GameplayBehavior
            set: { $raw: 'EGameplayBehavior/Nothing' }
            minChanges: 7
          - field: UpgradeFromUnit
            set: { $raw: 'nil' }
