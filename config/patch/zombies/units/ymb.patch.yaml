targets:
  - file: GameData/Generated/Gameplay/Gfx/UniteDescriptor.ndf
    operations:
      - forEach: ${zombieUnits}
        as: unit
        do:
          - op: copy
            selector: { kind: object, by: name, value: '${unit.from}' }
            destination: { name: 'Descriptor_Unit_YZ_${unit.id}' }
            leadingComment: '${commentDirectives.forceInclude}'
          - forEach: ${concat(['UNITE_YZ_' + unit.id], unit.tags)}
            as: tag
            do:
              - op: add
                selector:
                  {
                    kind: collection,
                    by: path,
                    value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TTagsModuleDescriptor].TagSet',
                  }
                position: { mode: before, anchor: '"Unite"' }
                value:
                  $raw: '"${tag}",'
          - forEach: ${unit.alsoRemove}
            as: modulePath
            do:
              - op: remove
                selector:
                  { kind: field, by: path, value: 'Descriptor_Unit_YZ_${unit.id}.${modulePath}' }
          - forEach: ${unit.alsoAdd}
            as: extra
            do:
              - op: add
                selector:
                  {
                    kind: collection,
                    by: path,
                    value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors',
                  }
                position: { mode: before, anchor: '${extra.anchor}' }
                value:
                  $raw: ${extra.value}
          - op: remove
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[value=$/GFX/Weapon/${unit.weapon}]',
              }
          - op: add
            selector:
              {
                kind: collection,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors',
              }
            position: { mode: before, anchor: TBaseDamageModuleDescriptor }
            value:
              $raw: '$/GFX/Weapon/WeaponDescriptor_YZ_${unit.id},'
          - op: remove
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TDangerousnessModuleDescriptor]',
              }
          - op: add
            selector:
              {
                kind: collection,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors',
              }
            position: { mode: before, anchor: TRoutModuleDescriptor }
            value:
              $raw: 'TDangerousnessModuleDescriptor( Dangerousness = ${unit.dangerousness} ),'
          - op: remove
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TRoutModuleDescriptor]',
              }
          - op: add
            selector:
              {
                kind: collection,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors',
              }
            position: { mode: before, anchor: '~/FacingInfosModuleDescriptor' }
            value:
              $raw: 'TRoutModuleDescriptor(MoralLevel = ${immortalDamageRaw}),'
          - op: add
            selector:
              {
                kind: collection,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors',
              }
            position: { mode: before, anchor: TUnitUIModuleDescriptor }
            value:
              $raw: |-
                TDeploymentShiftModuleDescriptor
                (
                    DeploymentShiftGRU = ${unit.deploymentShift}
                ),
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TVisibilityModuleDescriptor].UnitConcealmentBonus',
              }
            value: ${unit.concealment}
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TBaseDamageModuleDescriptor].MaxPhysicalDamages',
              }
            value: ${unit.physicalDamage}
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TBaseDamageModuleDescriptor].MaxStunDamages',
              }
            value:
              $raw: '${unit.stunDamage}'
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TInfantrySquadModuleDescriptor].SoldierCount',
              }
            value: ${unit.soldiers}
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TGenericMovementModuleDescriptor].MaxSpeedInKmph',
              }
            value: ${unit.speed}
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TProductionModuleDescriptor].ProductionRessourcesNeeded',
              }
            value:
              $raw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + unit.commandPoints + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
          - forEach: ${unit.set}
            as: edit
            do:
              - op: modify
                selector:
                  { kind: field, by: path, value: 'Descriptor_Unit_YZ_${unit.id}.${edit.at}' }
                value:
                  $raw: ${edit.value}
          - op: modify
            selector:
              {
                kind: field,
                by: path,
                value: 'Descriptor_Unit_YZ_${unit.id}.ModulesDescriptors.[TUnitUIModuleDescriptor].ButtonTexture',
              }
            value:
              $string: Texture_Button_Unit_YZ_${unit.id}
      - op: bulk
        match:
          conditions:
            - { on: name, is: startsWith, value: Descriptor_Unit_YZ_ }
        expect: { minBlocks: 7 }
        edits:
          - field: MotherCountry
            set: { $raw: '${modTagRaw}' }
