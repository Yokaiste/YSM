version: 1
id: ysm.zombies.units
name: YSM Zombie Units
description: Adds the seven zombie units -- swarm, breaker, screecher, stalker, smoker, pack leader, and demolisher -- with their roles, AI behavior, and unit cards.
enabled: true
scope: prod
optional: true
dependsOn:
  - ysm.zombies.weapons
files:
  - op: copy
    source: { root: patch, path: assets }
    destination: GameData/Assets/2D/Interface/Common/UnitsIcons/PACT
    expect: { files: 7 }
variables:
  modTagRaw: "'${modTag}'"
  immortalDamageRaw: '999999'
  zombieTicketCost: 1
  # One row per zombie: `from` is the vanilla squad, `weapon` its weapon manager. Rout
  # morale is pinned absurdly high below -- a zombie that routs stops being a zombie.
  zombieUnits:
    - id: Swarm
      from: Descriptor_Unit_MotSchutzen_DDR
      weapon: WeaponDescriptor_MotSchutzen_DDR
      icon: yz-swarm.png
      tags: ['Zombie']
      soldiers: 10
      speed: 68
      concealment: 4.6
      physicalDamage: 84
      stunDamage: '900'
      dangerousness: 190
      commandPoints: 56
      deploymentShift: '2500.0'
      alsoRemove: []
      alsoAdd: []
