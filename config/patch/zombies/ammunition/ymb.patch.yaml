        - { field: RadiusSplashSuppressDamagesGRU, value: '22' }
        - { field: AllowSuppressDamageWhenNoImpact, value: 'True' }
        - { field: DispersionAtMaxRangeGRU, value: '2' }
        - { field: AimingTime, value: '0.0' }
        - { field: TimeBetweenTwoShots, value: '0.2' }
        - { field: TimeBetweenTwoSalvos, value: '0.9' }
        - { field: ShotsCountPerSalvo, value: '6' }
        - { field: SupplyCost, value: '1.8' }
