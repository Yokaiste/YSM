version: 1
id: ysm.zombies.ammunition
name: YSM Zombie Ammunition
description: Defines the zombie attack profiles -- melee, panic scream, smoke, demolition charge, and anti-helicopter -- and the weapon-panel icon for each.
enabled: true
scope: prod
# The whole zombie chain cascades from here.
optional: true
dependsOn: []
files:
  - op: copy
    source: { root: patch, path: assets }
    destination: GameData/Assets/2D/Interface/Common/UnitsIcons/Armes/Panel_Info
    expect: { files: 10 }
variables:
  # One row per attack profile. The panel icon and its texture are both derived from `id`.
  zombieAmmo:
    - id: Assault_Shards
      from: Ammo_SHOT_KS_23
      set:
        - { field: DescriptorId, value: 'GUID:{71563898-d2e0-4298-93a1-721891f0e44e}' }
        - { field: Name, value: "'YZSHARD'" }
        - { field: MaximumRangeGRU, value: '35' }
        - { field: PhysicalDamages, value: '6.6' }
        - { field: SuppressDamages, value: '320.0' }
        - { field: RadiusSplashPhysicalDamagesGRU, value: '10' }
        - { field: RadiusSplashSuppressDamagesGRU, value: '30' }
        - { field: AllowSuppressDamageWhenNoImpact, value: 'True' }
        - { field: DispersionAtMaxRangeGRU, value: '2' }
        - { field: AimingTime, value: '0.0' }
        - { field: TimeBetweenTwoShots, value: '0.2' }
        - { field: TimeBetweenTwoSalvos, value: '0.8' }
        - { field: ShotsCountPerSalvo, value: '8' }
        - { field: SupplyCost, value: '2.5' }
        - { field: CanShootWhileMoving, value: 'True' }
