        - { field: RadiusSplashPhysicalDamagesGRU, value: '12' }
        - { field: RadiusSplashSuppressDamagesGRU, value: '30' }
        - { field: TargetOnlyOneUnitInDistrict, value: 'True' }
        - { field: DisplaySalveAccuracy, value: 'False' }
        - field: DamageTypeEvolutionOverRangeDescriptor
          value: '~/DamageTypeEvolutionOverRangeDescriptor_AP1_1Km'
        - { field: TirIndirect, value: 'False' }
        - { field: ProjectileSpeedGRU, value: '95' }
        - { field: TimeBetweenTwoShots, value: '0.5' }
