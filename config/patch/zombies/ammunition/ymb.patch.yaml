        - { field: Name, value: "'YZFANG'" }
        - { field: Arme, value: 'TDamageTypeRTTI(Family=DamageFamily_ap Index=19)' }
        - { field: WeaponCursorType, value: 'Weapon_Cursor_Canon' }
        - { field: MinMaxCategory, value: 'MinMax_CanonAP' }
        - { field: ProjectileType, value: 'EProjectileType/Obus' }
