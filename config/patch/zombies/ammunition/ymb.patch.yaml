        - { field: FireTriggeringProbability, value: '0.0' }
  # Screecher spit is anti-air, so it lives in AmmunitionMissiles.
  zombieMissileAmmo:
    - id: Screecher_Spore
      from: Ammo_MANPAD_igla
      set:
        - { field: DescriptorId, value: 'GUID:{49d9b837-cbf3-409a-818e-3e600f790d4a}' }
        - { field: Name, value: "'YZSPIT'" }
        - { field: MaximumRangeHelicopterGRU, value: '400' }
        - { field: MaximumRangeAirplaneGRU, value: '300' }
        - { field: RadiusSplashPhysicalDamagesGRU, value: '8' }
        - { field: PhysicalDamages, value: '18.0' }
        - { field: RadiusSplashSuppressDamagesGRU, value: '80' }
        - { field: SuppressDamages, value: '700.0' }
        - field: HitRollRuleDescriptor
          value: |-
            TDiceHitRollRuleDescriptor
            (
                BaseCriticModifier = 0
                BaseHitValueModifiers =
                [
                    (EBaseHitValueModifier/Base, -10),
                    (EBaseHitValueModifier/Idling, 15),
                    (EBaseHitValueModifier/Moving, -25),
                    (EBaseHitValueModifier/Targeted, 0),
                ]
                DistanceToTarget = True
            )
        - { field: AimingTime, value: '0.0' }
        - { field: TimeBetweenTwoSalvos, value: '7.5' }
        - { field: SupplyCost, value: '24' }
        - { field: CanShootWhileMoving, value: 'True' }
  allZombieAmmo: ${concat(zombieAmmo, zombieMissileAmmo)}
  iconPath: GameData:/Assets/2D/Interface/Common/UnitsIcons/Armes/Panel_Info
targets:
  - file: GameData/Generated/Gameplay/Gfx/Ammunition.ndf
    operations:
      - forEach: ${zombieAmmo}
        as: ammo
        do: &applyAmmo
          - op: copy
            selector: { kind: object, by: name, value: '${ammo.from}' }
            destination: { name: 'Ammo_YZ_${ammo.id}' }
          - forEach: ${ammo.set}
            as: edit
            do:
              - op: modify
                selector: { kind: field, by: path, value: 'Ammo_YZ_${ammo.id}.${edit.field}' }
                value:
                  $raw: ${edit.value}
          - op: modify
            selector: { kind: field, by: path, value: 'Ammo_YZ_${ammo.id}.InterfaceWeaponTexture' }
            value:
              $string: Texture_Interface_Weapon_YZ_${ammo.id}
  - file: GameData/Generated/Gameplay/Gfx/AmmunitionMissiles.ndf
    operations:
      - forEach: ${zombieMissileAmmo}
        as: ammo
        do: *applyAmmo
  - file: GameData/Generated/UserInterface/Textures/WeaponTextures.ndf
    operations:
      - forEach: ${allZombieAmmo}
        as: ammo
        do:
          - op: add
            value:
              $raw: 'Texture_Interface_Weapon_YZ_${ammo.id} is TUIResourceTexture_Common(FileName = "${iconPath}/YZ_${ammo.id}.png")'
          - op: add
            selector: { kind: collection, by: path, value: WeaponAdditionalTextureBank.Textures }
            value:
              $raw: '("Texture_Interface_Weapon_YZ_${ammo.id}", MAP [(~/ComponentState/Normal, ~/Texture_Interface_Weapon_YZ_${ammo.id})]),'
