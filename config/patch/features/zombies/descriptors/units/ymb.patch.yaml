        value:
          $raw: 'False'
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.ModulesDescriptors.[TScannerConfigurationDescriptor].VisionRangesGRU
        value:
          $raw: |-
            MAP [
                ( EVisionRange/Standard, 4200.0 ),
                ( EVisionRange/LowAltitude, 5654.0 ),
                ( EVisionRange/HighAltitude, 6361.0 ),
            ]
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.ModulesDescriptors.[TScannerConfigurationDescriptor].OpticalStrengths
        value:
