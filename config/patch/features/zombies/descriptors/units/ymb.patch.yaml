version: 1
id: ysm.descriptors.units.zombies
name: YSM Zombie Units
description: Creates the refactored zombie roster with clean roles, tighter AI behavior, proper anti-heli support, and less legacy stat bloat.
enabled: true
scope: prod
optional: true
dependsOn:
  - ysm.descriptors.weapons.zombies
variables:
  modTagRaw: "'${modTag}'"
  immortalDamageRaw: '999999'
  immortalRoutModuleRaw: 'TRoutModuleDescriptor(MoralLevel = 999999),'
  swarmMaxStunDamageRaw: '900'
  breakerMaxStunDamageRaw: '1100'
  screecherMaxStunDamageRaw: '850'
  stalkerMaxStunDamageRaw: '800'
  smokerMaxStunDamageRaw: '700'
  packLeaderMaxStunDamageRaw: '1200'
  demolisherMaxStunDamageRaw: '1300'
  groundTargetsOnlyRaw: |-
    [
        "GroundUnits",
    ]
  defaultZombieDeploymentShiftModuleRaw: |-
    TDeploymentShiftModuleDescriptor
    (
        DeploymentShiftGRU = 2500.0
    ),
  zombieTicketCost: 1
  swarmCommandPointCost: 56
  breakerCommandPointCost: 96
  screecherCommandPointCost: 90
  stalkerCommandPointCost: 76
  smokerCommandPointCost: 69
  packLeaderCommandPointCost: 178
  demolisherCommandPointCost: 131
  swarmProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + swarmCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  breakerProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + breakerCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  screecherProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + screecherCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  stalkerProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + stalkerCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  smokerProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + smokerCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  packLeaderProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + packLeaderCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
  demolisherProductionResourcesNeededRaw: "${'MAP [\\n                ($/GFX/Resources/Resource_CommandPoints, ' + demolisherCommandPointCost + '),\\n                ($/GFX/Resources/Resource_Tickets, ' + zombieTicketCost + '),\\n            ]'}"
targets:
  - file: GameData/Generated/Gameplay/Gfx/UniteDescriptor.ndf
    operations:
      - op: copy
        selector:
          kind: object
          by: name
          value: Descriptor_Unit_MotSchutzen_DDR
        destination:
          name: Descriptor_Unit_YZ_Swarm
        leadingComment: '${commentDirectives.forceInclude}'
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.DescriptorId
        value:
          $raw: GUID:{064bc26c-ad9c-4c59-835f-0aabd781148b}
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.ClassNameForDebug
        value:
          $raw: "'Unit_YZ_Swarm'"
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.ModulesDescriptors.[TTypeUnitModuleDescriptor].MotherCountry
        value:
          $raw: '${modTagRaw}'
      - op: add
        selector:
          kind: collection
          by: path
          value: Descriptor_Unit_YZ_Swarm.ModulesDescriptors.[TTagsModuleDescriptor].TagSet
        position:
          mode: before
          anchor: '"Unite"'
        value:
          $raw: |-
            "UNITE_YZ_Swarm",
            "Zombie",
      - op: modify
        selector:
          kind: field
          by: path
          value: Descriptor_Unit_YZ_Swarm.ModulesDescriptors.[TVisibilityModuleDescriptor].UnitConcealmentBonus
