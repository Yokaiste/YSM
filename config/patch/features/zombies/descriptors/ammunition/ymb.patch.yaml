version: 1
id: ysm.descriptors.ammunition.zombies
name: YSM Zombie Ammunition
description: Defines the refactored zombie ammo roster with role-specific melee, panic, smoke, demolisher, and anti-heli attack profiles.
enabled: true
scope: prod
optional: true
