version: 1
id: 'ysm.gameplay.deck-generation.core'
name: 'YSM Sandbox Deck Generation'
description: 'Generates the general sandbox country, coalition, and all-side decks.'
enabled: true
scope: 'prod'
dependsOn:
  - 'ysm.descriptors.buildings'
  - 'ysm.descriptors.units'
  - 'ysm.descriptors.units.cheats'
  - 'ysm.descriptors.units.nuclear'
  - 'ysm.gameplay.cost-matrix'
  - 'ysm.ui.generated.countries'
  - 'ysm.ui.generated.division-types'
variables:
  sandboxUnlimitedUnitPatterns:
    - '^Descriptor_Unit_YS_'
    - '^Descriptor_Unit_YC_'
    - '^Descriptor_Unit_YN_'
  deckGeneration:
    deckSlotCount: ${deckSlotCount}
    unlimitedPackUnitCount: ${unlimitedPackUnitCount}
    commentDirectives:
      ignore: '${commentDirectives.ignore}'
      everythingBelow: '${commentDirectives.everythingBelow}'
      forceInclude: '${commentDirectives.forceInclude}'
    preferredUnitCountryIdsByCoalition:
      NATO:
        - 'US'
      PACT:
        - 'SOV'
    contextGeneration:
      countries: true
      coalitions: true
      allSides: true
    ignoredCountryIds:
      - '${modTag}'
    # NOTE: '_multi_' rules are the regular multiplayer divisions — the primary
    # source of vanilla availability numbers. Never ignore them.
    ignoredDivisionRuleNamePatterns:
      - '_challenge_'
      - '_special_'
    forcedPremadeUnitPatterns:
      countryUnlimited: ${sandboxUnlimitedUnitPatterns}
      sideUnlimited: ${sandboxUnlimitedUnitPatterns}
      allSideUnlimited: ${sandboxUnlimitedUnitPatterns}
scripts:
  - path: 'generate-sandbox-decks.ts'
    tests:
      - 'generate-sandbox-decks.test.ts'
