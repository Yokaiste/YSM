version: 1
id: 'ysm.descriptors.units.nuclear'
name: 'YSM Nuclear Planes'
description: 'Adds two YN endgame strike bombers with tuned native tactical-nuclear visuals and concise weapon metadata.'
enabled: true
scope: 'prod'
optional: true
dependsOn: []
variables:
  modTagRaw: "'${modTag}'"
  # Vanilla bomber the carriers are cloned from.
  nukeUnitSourceDescriptorName: 'Descriptor_Unit_Tu_22_HE_SOV'

  # --- Tuning ---------------------------------------------------------------
  nukeCommandPointCost: 5000
  nukeX2CommandPointCost: 10000
  nukeTicketCost: 10
  nukeSupplyCostRaw: '700.0'
  # Blast radius in GRU. The x2 variant is deliberately double the base.
  nukeRadiusGruRaw: '1460.99'
  nukeX2RadiusGruRaw: '2921.98'
  nukePhysicalDamageRaw: '500.0'
  nukeSuppressDamageRaw: '100000.0'
  # How long the fires burn, and how long the bomber takes to arrive.
  nukeFireLifetimeRaw: '60'
  nukeCarrierTravelDurationRaw: '33'
  # Showroom-only attack/defense bars on the carrier.
  nukeStrategicAttackValue: 999
  nukeStrategicDefenseValue: 450

  # --- Derived and fixed ----------------------------------------------------
  # Derived from the blast radius above; edit the radius, not these.
  nukeDepictionRadiusRaw: "${nukeRadiusGruRaw + ' * 26 * 2.83'}"
  nukeX2DepictionRadiusRaw: "${nukeX2RadiusGruRaw + ' * 26 * 2.83'}"
  nukeSuppressSplashRadiusRaw: "${nukeRadiusGruRaw + ' * 2.5'}"
  nukeX2SuppressSplashRadiusRaw: "${nukeX2RadiusGruRaw + ' * 2.5'}"
  # Fixed behaviour: one guaranteed shot, no dispersion.
  nukeFireDelayRaw: '0.5'
  nukeGuaranteedProbabilityRaw: '1.0'
  nukeSingleSalvoIntervalRaw: '1.0'
  nukeSingleShotCountRaw: '1'
  nukeImpactHappeningRaw: "'YSMNuke50'"
  nukeX2ImpactHappeningRaw: "'YSMNuke100'"
  zeroDispersionRaw: '0'
  nukeProductionResourcesNeededRaw: "${'MAP [\\n        ($/GFX/Resources/Resource_CommandPoints, ' + nukeCommandPointCost + '),\\n        ($/GFX/Resources/Resource_Tickets, ' + nukeTicketCost + '),\\n    ]'}"
  nukeX2ProductionResourcesNeededRaw: "${'MAP [\\n        ($/GFX/Resources/Resource_CommandPoints, ' + nukeX2CommandPointCost + '),\\n        ($/GFX/Resources/Resource_Tickets, ' + nukeTicketCost + '),\\n    ]'}"
targets:
  - file: 'GameData/Fx/Set/FX_Impact_Nuke.ndf'
    operations:
      - op: 'copy'
        selector:
          kind: 'object'
          by: 'name'
          value: 'fx_impact_sol_Tactical_Nuke'
        destination:
          name: 'fx_impact_sol_YN_Nuke'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'fx_impact_sol_YN_Nuke.SizeFactor'
        value:
          $raw: '12.0'
      - op: 'copy'
        selector:
          kind: 'object'
          by: 'name'
          value: 'fx_impact_sol_Tactical_Nuke'
        destination:
          name: 'fx_impact_sol_YN_Nuke_X2'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'fx_impact_sol_YN_Nuke_X2.SizeFactor'
        value:
          $raw: '15.0'
  - file: 'GameData/Generated/Gameplay/Gfx/MimeticImpactMapping.ndf'
    operations:
      - op: 'add'
        position: { mode: 'after', anchor: 'FxImpactSolTacticalNuke' }
        value:
          $raw: |-
            FxImpactSolYNNuke is ImpactWrapper( Action = $/GFX/GameFx/fx_impact_sol_YN_Nuke )
            FxImpactSolYNNukeX2 is ImpactWrapper( Action = $/GFX/GameFx/fx_impact_sol_YN_Nuke_X2 )

            unnamed TMimeticWorldHappeningRegistration
            (
                MimeticWorldDescriptor = $/DepictionCore/MimeticWorldDescriptor
                Happenings = MAP
                [
                    ('YSMNuke50', TImpactHappening( Happenings = MAP[
                        ( EImpactSurface/Ground , FxImpactSolYNNuke ),
                        ( EImpactSurface/Water , FxImpactSolYNNuke ),
                        ( EImpactSurface/Air , FxImpactSolYNNuke ),
                        ( EImpactSurface/Wall , FxImpactSolYNNuke ),
                        ( EImpactSurface/Vehicle , FxImpactSolYNNuke ),
                        ( EImpactSurface/FlyingVehicle , FxImpactSolYNNuke ),
                        ( EImpactSurface/Missile , nil ),
                        ( EImpactSurface/Ricochet , nil ),
                    ])),
                    ('YSMNuke100', TImpactHappening( Happenings = MAP[
                        ( EImpactSurface/Ground , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/Water , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/Air , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/Wall , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/Vehicle , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/FlyingVehicle , FxImpactSolYNNukeX2 ),
                        ( EImpactSurface/Missile , nil ),
                        ( EImpactSurface/Ricochet , nil ),
                    ])),
                ]
            )
  - file: 'GameData/Generated/Gameplay/Gfx/FireDescriptor.ndf'
    operations:
      - op: 'copy'
        selector:
          kind: 'object'
          by: 'name'
          value: 'Descriptor_Fire_NapalmSpecial'
        destination:
          name: 'Descriptor_Fire_YN_Nuke'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.DescriptorId'
        value:
          $raw: 'GUID:{9d1cac3e-c432-4696-93d7-85d45b688c5f}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ClassNameForDebug'
        value:
          $raw: "'Fire_YN_Nuke'"
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TApparenceModuleDescriptor].Depiction.DepictionDescriptor.Radius'
        value:
          $raw: '${nukeDepictionRadiusRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].TimeToLive'
        value:
          $raw: '${nukeFireLifetimeRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].TimeBeforeSpreading'
        value:
          $raw: '${nukeFireDelayRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].TimeBeforeSpreadAttempt'
        value:
          $raw: '${nukeFireDelayRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].SpreadProbability'
        value:
          $raw: '${nukeGuaranteedProbabilityRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].IsNewFireProbability'
        value:
          $raw: '${nukeGuaranteedProbabilityRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].RadiusGRU'
        value:
          $raw: '${nukeRadiusGruRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].AmmunitionForBurn'
        value:
          $raw: '$/GFX/Weapon/Ammo_Degats_napalm_lourd'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke.ModulesDescriptors.[TFireModuleDescriptor].IgniteDistricts'
        value:
          $raw: 'True'
      - op: 'copy'
        selector:
          kind: 'object'
          by: 'name'
          value: 'Descriptor_Fire_YN_Nuke'
        destination:
          name: 'Descriptor_Fire_YN_Nuke_X2'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke_X2.DescriptorId'
        value:
          $raw: 'GUID:{43c680d5-50da-44e4-b691-75b3b0a49a00}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke_X2.ClassNameForDebug'
        value:
          $raw: "'Fire_YN_Nuke_X2'"
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke_X2.ModulesDescriptors.[TApparenceModuleDescriptor].Depiction.DepictionDescriptor.Radius'
        value:
          $raw: '${nukeX2DepictionRadiusRaw}'
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Fire_YN_Nuke_X2.ModulesDescriptors.[TFireModuleDescriptor].RadiusGRU'
        value:
          $raw: '${nukeX2RadiusGruRaw}'
  - file: 'GameData/Generated/Gameplay/Gfx/Ammunition.ndf'
    operations:
      - op: 'copy'
        selector:
          kind: 'object'
          by: 'name'
          value: 'Ammo_Bomb_BRF_1000kg_x2'
