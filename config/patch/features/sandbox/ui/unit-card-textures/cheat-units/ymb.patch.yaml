version: 1
id: 'ysm.sandbox.ui.unit-card-textures.cheats'
name: 'YSM Cheat Unit Card Textures'
description: 'Registers the YC cheat unit card textures and assigns them to the cheat roster.'
enabled: true
scope: 'prod'
optional: true
dependsOn:
  - 'ysm.descriptors.units.cheats'
targets:
  - file: 'GameData/Generated/UserInterface/Textures/ButtonTexturesUnites.ndf'
    operations:
      - op: 'add'
        selector:
          kind: 'collection'
          by: 'path'
          value: 'UnitButtonTextureAdditionalBank.Textures'
        value:
          $raw: |-
            ("Texture_Button_Unit_YC_Illegal", MAP [( ~/ComponentState/Normal, TUIResourceTexture( FileName = "GameData:/Assets/2D/Interface/Common/UnitsIcons/NATO/yc-illegal.png"))]),
      - op: 'add'
        selector:
          kind: 'collection'
          by: 'path'
          value: 'UnitButtonTextureAdditionalBank.Textures'
        value:
          $raw: |-
            ("Texture_Button_Unit_YC_Oracle", MAP [( ~/ComponentState/Normal, TUIResourceTexture( FileName = "GameData:/Assets/2D/Interface/Common/UnitsIcons/NATO/yc-oracle.png"))]),
  - file: 'GameData/Generated/Gameplay/Gfx/UniteDescriptor.ndf'
    operations:
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Unit_YC_Illegal.ModulesDescriptors.[TUnitUIModuleDescriptor].ButtonTexture'
        value:
          $raw: "'Texture_Button_Unit_YC_Illegal'"
      - op: 'modify'
        selector:
          kind: 'field'
          by: 'path'
          value: 'Descriptor_Unit_YC_Oracle.ModulesDescriptors.[TUnitUIModuleDescriptor].ButtonTexture'
        value:
          $raw: "'Texture_Button_Unit_YC_Oracle'"
