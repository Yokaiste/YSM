version: 1
id: 'ysm'
name: 'Yokaiste’s Sandbox Mod'
description: 'Break the limits. Build the battle you want.'
enabled: true

# Top-level knobs. Per-feature tuning lives in that feature's ymb.patch.yaml.
variables:
  # Changing it after release orphans existing decks -- treat it as permanent.
  modTag: 'YSM'
  # Shown on the welcome screen.
  author: 'Yokaiste'
  modVersion: '2.6'
  # Uncomment for a dismissable welcome-screen notice.
  # alert:
  #   title: ''
  #   text: ''
  links:
    - name: 'Steam Workshop'
      url: 't.ly/87TI3'
    - name: 'YSM Community'
      url: 't.ly/ZRnSO'
    - name: 'Restore Decks & Combine Mods'
      url: 't.ly/Nk20O'
    - name: "Yokaiste's Mod Builder"
      url: 't.ly/NIJ0e'

  # Cards per category. Generation, cost matrix, armory, and deck creator must agree.
  deckSlotCount: 80
  # Units per pack on the Unlimited division variants.
  unlimitedPackUnitCount: 999
  # true also drops units no division fields at all -- a tighter roster, minus WARNO's own
  # test units. Either way a unit stays out if every division holding it blocks its
  # category: no card slots, or every slot free at a raised activation limit.
  excludeHidden: false

  # Effectively bottomless. NDF float literal: keep the trailing `.0`.
  unlimitedSupplyCapacity: '2000000.0'

  # Supply units are priced off the vanilla unit they clone, so the range moves together.
  # What the bottomless pool is worth over the stock unit.
  unlimitedPriceMultiplier: 2
  # Per step up the base line: base -> bunker -> doomsday, compounding.
  fortifiedTierPriceMultiplier: 1.5
  # Off-map air slots. Read by the off-map panel and skirmish production.
  planeCap: 297

  # Comments you can put in a descriptor to steer deck generation by hand.
  commentDirectives:
    ignore: '${modTag}-ignore' # skip this one descriptor
    everythingBelow: '${modTag}-ignore-everything-below' # skip the rest of the file
    forceInclude: '${modTag}-force-include' # keep it despite the rules above

