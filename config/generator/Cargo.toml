[package]
name = "ysm"
edition = "2024"
license-file = "../../LICENSE"
repository = "https://github.com/Yokaiste/YSM"
publish = false

[workspace]

[dependencies]
ymb-sdk = { path = "../../../../src/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
png = "0.18.1"
qrcodegen = "1.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

